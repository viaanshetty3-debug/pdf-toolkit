<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Forms · PDF Toolkit</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topnav"></header>
  <main>
    <h1>PDF Forms</h1>
    <p class="subtitle">Fill form fields and flatten the result for sharing.</p>

    <div class="dropzone" id="drop">
      <input type="file" />
      <div class="big">▤</div>
      <div><strong>Drop a form PDF</strong> or click to browse</div>
    </div>

    <div id="loaded" class="hidden">
      <div class="card" style="margin-top: 20px;">
        <div class="row">
          <strong id="loadedname"></strong>
          <span class="pill" id="loadedfields"></span>
          <div class="spacer"></div>
          <button class="btn secondary" id="changefile">Change file</button>
        </div>

        <div id="fields"></div>

        <div class="row" style="margin-top: 20px; align-items:center;">
          <label><input type="checkbox" id="flatten" checked /> Flatten form (make non-editable)</label>
          <div class="spacer"></div>
          <div class="progress hidden" id="progwrap" style="flex:0 0 200px"><div class="bar" id="bar"></div></div>
          <button class="btn" id="go">Fill & Download</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderNav, makeDropzone, postForm, downloadBlob, humanSize, toast } from '/common.js';
    renderNav();
    let file = null, fields = [];
    const dropEl = document.getElementById('drop'), loadedEl = document.getElementById('loaded');
    const bar = document.getElementById('bar'), progwrap = document.getElementById('progwrap');
    const fieldsEl = document.getElementById('fields');

    const dz = makeDropzone(dropEl, { multiple: false });
    dz.setOnFiles(async arr => {
      if (!arr.length) return;
      file = arr[0];
      const fd = new FormData(); fd.append('file', file);
      try {
        const r = await fetch('/api/forms/inspect', { method: 'POST', body: fd });
        if (!r.ok) throw new Error((await r.json()).error);
        const meta = await r.json();
        fields = meta.fields;
        document.getElementById('loadedname').textContent = file.name;
        document.getElementById('loadedfields').textContent = `${fields.length} field${fields.length === 1 ? '' : 's'}`;
        dropEl.classList.add('hidden'); loadedEl.classList.remove('hidden');
        renderFields();
      } catch (e) { toast(e.message, 'err'); }
    });

    document.getElementById('changefile').addEventListener('click', () => {
      file = null; fields = [];
      dropEl.classList.remove('hidden'); loadedEl.classList.add('hidden');
    });

    function renderFields() {
      if (fields.length === 0) {
        fieldsEl.innerHTML = '<p class="subtitle" style="margin-top:16px">This PDF has no fillable form fields.</p>';
        return;
      }
      fieldsEl.innerHTML = fields.map(f => {
        const id = `fld_${encode(f.name)}`;
        if (f.type === 'PDFCheckBox') {
          return `<label class="field" style="display:flex;align-items:center;gap:8px;margin-top:14px;">
            <input type="checkbox" id="${id}" data-name="${escapeAttr(f.name)}" data-type="check" ${f.value ? 'checked' : ''} />
            ${escapeHtml(f.name)} <span class="pill">checkbox</span>
          </label>`;
        }
        if (f.type === 'PDFRadioGroup' || f.type === 'PDFDropdown') {
          const opts = (f.options || []).map(o => `<option value="${escapeAttr(o)}" ${o === f.value ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
          return `<label class="field">${escapeHtml(f.name)} <span class="pill">${f.type === 'PDFRadioGroup' ? 'radio' : 'dropdown'}</span></label>
            <select id="${id}" data-name="${escapeAttr(f.name)}" data-type="select">${opts}</select>`;
        }
        return `<label class="field">${escapeHtml(f.name)}</label>
          <input type="text" id="${id}" data-name="${escapeAttr(f.name)}" data-type="text" value="${escapeAttr(f.value || '')}" />`;
      }).join('');
    }

    function encode(s) { return s.replace(/[^a-zA-Z0-9]/g, '_'); }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function escapeAttr(s) { return escapeHtml(s); }

    document.getElementById('go').addEventListener('click', async () => {
      if (!file) return;
      const values = {};
      fieldsEl.querySelectorAll('[data-name]').forEach(el => {
        const name = el.dataset.name;
        if (el.dataset.type === 'check') values[name] = el.checked;
        else values[name] = el.value;
      });
      const fd = new FormData();
      fd.append('file', file);
      fd.append('values', JSON.stringify(values));
      fd.append('flatten', document.getElementById('flatten').checked ? 'true' : 'false');
      progwrap.classList.remove('hidden'); bar.style.width = '0%';
      try {
        const { blob } = await postForm('/api/forms/fill', fd, bar);
        downloadBlob(blob, 'filled.pdf');
        toast('Form filled', 'ok');
      } catch (e) { toast(e.message, 'err'); }
      finally { setTimeout(() => progwrap.classList.add('hidden'), 800); }
    });
  </script>
</body>
</html>
