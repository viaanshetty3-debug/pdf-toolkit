<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Viewer · PDF Toolkit</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.js"></script>
  <style>
    .viewer-layout { display: grid; grid-template-columns: 180px 1fr; gap: 16px; margin-top: 20px; }
    .thumb-rail { max-height: 80vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .thumb-rail .thumb { background: var(--panel-2); border: 2px solid var(--border); border-radius: 8px; padding: 6px; cursor: pointer; }
    .thumb-rail .thumb.active { border-color: var(--accent); }
    .thumb-rail .thumb canvas { width: 100%; display: block; background: #fff; border-radius: 4px; }
    .thumb-rail .thumb .lbl { text-align: center; font-size: 11px; color: var(--muted); margin-top: 4px; }
    .viewer-main { display: flex; flex-direction: column; }
    .viewer-toolbar {
      display: flex; gap: 8px; align-items: center;
      padding: 10px 14px; margin-bottom: 10px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      position: sticky; top: 72px; z-index: 10;
    }
    .viewer-toolbar input[type=text] { width: 220px; }
    .viewer-toolbar .zoom-pill { padding: 4px 10px; background: var(--panel-2); border-radius: 6px; font-size: 13px; color: var(--muted); }
    .pages { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .page-wrap { position: relative; }
    .page-wrap canvas { display: block; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
    .page-wrap .textLayer {
      position: absolute; left: 0; top: 0;
      overflow: hidden; opacity: 0.2; line-height: 1;
      pointer-events: auto;
    }
    .page-wrap .textLayer span { position: absolute; white-space: pre; color: transparent; transform-origin: 0% 0%; }
    .page-wrap .highlight { background: #fde047; opacity: 0.4; position: absolute; }
    .page-wrap .pageno { position: absolute; top: 8px; right: 12px; font-size: 11px; color: var(--muted); background: rgba(255,255,255,.9); padding: 2px 8px; border-radius: 999px; }
  </style>
</head>
<body>
  <header class="topnav"></header>
  <main style="max-width: 1400px;">
    <h1>PDF Viewer</h1>
    <p class="subtitle">Open and read PDFs. Zoom, search, select text, jump by page.</p>

    <div class="dropzone" id="drop">
      <input type="file" />
      <div class="big">📖</div>
      <div><strong>Drop a PDF</strong> or click to browse</div>
    </div>

    <div id="loaded" class="hidden">
      <div class="row" style="margin-top: 16px;">
        <strong id="loadedname"></strong>
        <span class="pill" id="loadedpages"></span>
        <div class="spacer"></div>
        <button class="btn secondary" id="changefile">Change file</button>
      </div>
      <div class="viewer-layout">
        <div class="thumb-rail" id="rail"></div>
        <div class="viewer-main">
          <div class="viewer-toolbar">
            <button class="btn ghost" id="zoomOut">−</button>
            <span class="zoom-pill" id="zoomLbl">100%</span>
            <button class="btn ghost" id="zoomIn">+</button>
            <button class="btn ghost" id="fitWidth">Fit width</button>
            <div class="spacer"></div>
            <input type="text" id="search" placeholder="Search in document..." />
            <span class="zoom-pill" id="searchResults"></span>
          </div>
          <div class="pages" id="pages"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderNav, makeDropzone, humanSize, toast } from '/common.js';
    import { openPdf, renderThumb } from '/pdf-thumbs.js';
    renderNav();
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.js';

    let file = null, pdf = null;
    let scale = 1.5;
    const pageCanvases = new Map();  // pageNum -> { canvas, textLayer, viewport }
    const dropEl = document.getElementById('drop'), loadedEl = document.getElementById('loaded');
    const pagesEl = document.getElementById('pages');
    const railEl = document.getElementById('rail');

    const dz = makeDropzone(dropEl, { multiple: false });
    dz.setOnFiles(async arr => {
      if (!arr.length) return;
      file = arr[0];
      pdf = await openPdf(file);
      document.getElementById('loadedname').textContent = file.name;
      document.getElementById('loadedpages').textContent = `${pdf.numPages} pages · ${humanSize(file.size)}`;
      dropEl.classList.add('hidden'); loadedEl.classList.remove('hidden');
      buildRail();
      await renderAll();
    });

    document.getElementById('changefile').addEventListener('click', () => {
      file = null; pdf = null; pagesEl.innerHTML = ''; pageCanvases.clear();
      dropEl.classList.remove('hidden'); loadedEl.classList.add('hidden');
    });

    function buildRail() {
      railEl.innerHTML = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const t = document.createElement('div');
        t.className = 'thumb' + (i === 1 ? ' active' : '');
        t.innerHTML = `<canvas></canvas><div class="lbl">${i}</div>`;
        t.addEventListener('click', () => {
          document.getElementById(`page-${i}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        railEl.appendChild(t);
        renderThumb(pdf, i, t.querySelector('canvas'), 0.2).catch(() => {});
      }
    }

    async function renderAll() {
      pagesEl.innerHTML = '';
      pageCanvases.clear();
      for (let i = 1; i <= pdf.numPages; i++) {
        const wrap = document.createElement('div');
        wrap.className = 'page-wrap';
        wrap.id = `page-${i}`;
        const canvas = document.createElement('canvas');
        const text = document.createElement('div');
        text.className = 'textLayer';
        const label = document.createElement('div');
        label.className = 'pageno';
        label.textContent = `Page ${i} of ${pdf.numPages}`;
        wrap.appendChild(canvas); wrap.appendChild(text); wrap.appendChild(label);
        pagesEl.appendChild(wrap);
        await renderPage(i, canvas, text);
      }
      updateZoomLabel();
    }

    async function renderPage(num, canvas, textLayer) {
      const page = await pdf.getPage(num);
      const viewport = page.getViewport({ scale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      textLayer.style.width = `${viewport.width}px`;
      textLayer.style.height = `${viewport.height}px`;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      // Render text layer manually (pdf.js changed its API in v4).
      textLayer.innerHTML = '';
      const content = await page.getTextContent();
      for (const item of content.items) {
        const [a, b, c, d, e, f] = item.transform;
        const fontSize = Math.hypot(a, b);
        const span = document.createElement('span');
        span.textContent = item.str;
        span.style.left = `${e}px`;
        // pdf.js transforms are bottom-up; convert to top-left origin.
        span.style.top = `${viewport.height - f - fontSize}px`;
        span.style.fontSize = `${fontSize}px`;
        textLayer.appendChild(span);
      }
      pageCanvases.set(num, { canvas, textLayer, viewport });
    }

    // Zoom.
    function updateZoomLabel() { document.getElementById('zoomLbl').textContent = `${Math.round(scale / 1.5 * 100)}%`; }
    document.getElementById('zoomIn').addEventListener('click', async () => { scale *= 1.2; await renderAll(); });
    document.getElementById('zoomOut').addEventListener('click', async () => { scale /= 1.2; await renderAll(); });
    document.getElementById('fitWidth').addEventListener('click', async () => {
      if (!pdf) return;
      const page = await pdf.getPage(1);
      const vp = page.getViewport({ scale: 1 });
      const width = pagesEl.clientWidth - 40;
      scale = width / vp.width;
      await renderAll();
    });

    // Search.
    const searchInput = document.getElementById('search');
    const searchResults = document.getElementById('searchResults');
    let searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(doSearch, 200);
    });
    function doSearch() {
      // Clear previous highlights.
      pagesEl.querySelectorAll('.highlight').forEach(h => h.remove());
      const q = searchInput.value.trim().toLowerCase();
      if (!q) { searchResults.textContent = ''; return; }
      let count = 0;
      pageCanvases.forEach(({ textLayer }) => {
        textLayer.querySelectorAll('span').forEach(span => {
          const text = span.textContent.toLowerCase();
          let idx = text.indexOf(q);
          while (idx >= 0) {
            // Approximate highlight: wrap full span (easier than measuring sub-text).
            const hl = document.createElement('div');
            hl.className = 'highlight';
            hl.style.left = span.style.left;
            hl.style.top = span.style.top;
            hl.style.width = `${span.offsetWidth}px`;
            hl.style.height = `${span.offsetHeight}px`;
            textLayer.appendChild(hl);
            count++;
            idx = text.indexOf(q, idx + 1);
          }
        });
      });
      searchResults.textContent = count === 0 ? 'no results' : `${count} match${count === 1 ? '' : 'es'}`;
    }
  </script>
</body>
</html>
