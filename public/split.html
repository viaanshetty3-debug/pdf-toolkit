<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Split PDF · PDF Toolkit</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topnav"></header>
  <main>
    <h1>Split PDF</h1>
    <p class="subtitle">Split by page range, every N pages, or extract a single range.</p>

    <div class="dropzone" id="drop">
      <input type="file" />
      <div class="big">✂</div>
      <div><strong>Drop a PDF</strong> or click to browse</div>
    </div>

    <div id="loaded" class="hidden">
      <div class="card" style="margin-top: 20px;">
        <div class="row"><strong id="loadedname"></strong><span class="pill" id="loadedpages"></span><div class="spacer"></div><button class="btn secondary" id="changefile">Change file</button></div>

        <label class="field">Mode</label>
        <select id="mode">
          <option value="ranges">By page ranges — one PDF per range (ZIP)</option>
          <option value="every">Every N pages — fixed-size parts (ZIP)</option>
          <option value="extract">Extract range — single PDF</option>
        </select>

        <div id="rangesWrap">
          <label class="field">Ranges <span class="pill">e.g. 1-3, 5, 7-9</span></label>
          <input type="text" id="ranges" placeholder="1-3, 5, 7-9" />
        </div>

        <div id="sizeWrap" class="hidden">
          <label class="field">Pages per part</label>
          <input type="text" id="size" placeholder="2" value="2" />
        </div>

        <div class="progress hidden" id="progwrap"><div class="bar" id="bar"></div></div>

        <div class="row right" style="margin-top: 20px;">
          <button class="btn" id="go">Split & Download</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderNav, makeDropzone, postForm, downloadBlob, humanSize, toast } from '/common.js';
    renderNav();

    let file = null;
    let pageCount = 0;
    const dropEl = document.getElementById('drop');
    const loadedEl = document.getElementById('loaded');
    const mode = document.getElementById('mode');
    const rangesWrap = document.getElementById('rangesWrap');
    const sizeWrap = document.getElementById('sizeWrap');
    const bar = document.getElementById('bar');
    const progwrap = document.getElementById('progwrap');

    mode.addEventListener('change', () => {
      if (mode.value === 'every') { sizeWrap.classList.remove('hidden'); rangesWrap.classList.add('hidden'); }
      else { sizeWrap.classList.add('hidden'); rangesWrap.classList.remove('hidden'); }
    });

    const dz = makeDropzone(dropEl, { multiple: false });
    dz.setOnFiles(async arr => {
      if (!arr.length) return;
      file = arr[0];
      // Fetch meta for page count.
      try {
        const fd = new FormData(); fd.append('file', file);
        const r = await fetch('/api/inspect', { method: 'POST', body: fd });
        if (!r.ok) throw new Error((await r.json()).error);
        const meta = await r.json();
        pageCount = meta.pageCount;
        document.getElementById('loadedname').textContent = file.name;
        document.getElementById('loadedpages').textContent = `${pageCount} pages · ${humanSize(file.size)}`;
        dropEl.classList.add('hidden');
        loadedEl.classList.remove('hidden');
      } catch (e) { toast(e.message, 'err'); }
    });

    document.getElementById('changefile').addEventListener('click', () => {
      file = null;
      dropEl.classList.remove('hidden');
      loadedEl.classList.add('hidden');
    });

    document.getElementById('go').addEventListener('click', async () => {
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      fd.append('mode', mode.value);
      if (mode.value === 'every') fd.append('size', document.getElementById('size').value);
      else fd.append('ranges', document.getElementById('ranges').value);
      progwrap.classList.remove('hidden'); bar.style.width = '0%';
      try {
        const { blob } = await postForm('/api/split', fd, bar);
        const name = mode.value === 'extract' ? 'extracted.pdf' : 'split.zip';
        downloadBlob(blob, name);
        toast('Done', 'ok');
      } catch (e) { toast(e.message, 'err'); }
      finally { setTimeout(() => progwrap.classList.add('hidden'), 800); }
    });
  </script>
</body>
</html>
