<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Summarizer · PDF Toolkit</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topnav"></header>
  <main>
    <h1>AI Summarizer</h1>
    <p class="subtitle">A faithful, concise summary of any PDF. Powered by Gemini.</p>

    <div id="banner" class="card hidden" style="border-left: 3px solid var(--danger); margin-bottom: 16px;">
      <strong>No API key configured.</strong> Set <code>GEMINI_API_KEY</code> in your environment and restart the server.
    </div>

    <div class="dropzone" id="drop">
      <input type="file" />
      <div class="big">✦</div>
      <div><strong>Drop a PDF</strong> or click to browse</div>
    </div>

    <div id="loaded" class="hidden">
      <div class="card" style="margin-top: 20px;">
        <div class="row">
          <strong id="loadedname"></strong>
          <span class="pill" id="loadedsize"></span>
          <div class="spacer"></div>
          <button class="btn secondary" id="changefile">Change file</button>
        </div>

        <label class="field">Length</label>
        <select id="length">
          <option value="short">Short (2–3 sentences)</option>
          <option value="medium" selected>Medium (~150 words)</option>
          <option value="long">Long (~400 words)</option>
        </select>

        <label class="field">Style</label>
        <select id="style">
          <option value="paragraph" selected>Flowing prose</option>
          <option value="bullets">Bullet points</option>
        </select>

        <div class="progress hidden" id="progwrap"><div class="bar" id="bar"></div></div>

        <div class="row right" style="margin-top: 20px;">
          <button class="btn" id="go">Summarize</button>
        </div>

        <div id="result" class="card hidden" style="margin-top: 20px; background: var(--panel-2); border-left: 3px solid var(--accent); white-space: pre-wrap; line-height: 1.6;"></div>
        <div class="row right hidden" id="resActions" style="margin-top: 10px;">
          <button class="btn secondary" id="copy">Copy</button>
          <button class="btn secondary" id="download">Download .txt</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderNav, makeDropzone, humanSize, toast, downloadBlob } from '/common.js';
    renderNav();

    (async () => {
      try {
        const r = await fetch('/api/ai/status');
        const s = await r.json();
        if (!s.configured) document.getElementById('banner').classList.remove('hidden');
      } catch {}
    })();

    let file = null, summary = '';
    const dropEl = document.getElementById('drop'), loadedEl = document.getElementById('loaded');
    const bar = document.getElementById('bar'), progwrap = document.getElementById('progwrap');
    const resultEl = document.getElementById('result'), resActions = document.getElementById('resActions');

    const dz = makeDropzone(dropEl, { multiple: false });
    dz.setOnFiles(arr => {
      if (!arr.length) return;
      file = arr[0];
      document.getElementById('loadedname').textContent = file.name;
      document.getElementById('loadedsize').textContent = humanSize(file.size);
      dropEl.classList.add('hidden'); loadedEl.classList.remove('hidden');
    });
    document.getElementById('changefile').addEventListener('click', () => {
      file = null;
      dropEl.classList.remove('hidden'); loadedEl.classList.add('hidden');
      resultEl.classList.add('hidden'); resActions.classList.add('hidden');
    });

    document.getElementById('go').addEventListener('click', async () => {
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      fd.append('length', document.getElementById('length').value);
      fd.append('style', document.getElementById('style').value);
      progwrap.classList.remove('hidden'); bar.style.width = '20%';
      resultEl.classList.add('hidden'); resActions.classList.add('hidden');
      try {
        const r = await fetch('/api/ai/summarize', { method: 'POST', body: fd });
        bar.style.width = '95%';
        if (!r.ok) throw new Error((await r.json()).error);
        const data = await r.json();
        bar.style.width = '100%';
        summary = data.summary;
        resultEl.textContent = summary;
        resultEl.classList.remove('hidden');
        resActions.classList.remove('hidden');
        toast('Summary ready', 'ok');
      } catch (e) { toast(e.message, 'err'); }
      finally { setTimeout(() => progwrap.classList.add('hidden'), 800); }
    });

    document.getElementById('copy').addEventListener('click', () => {
      navigator.clipboard.writeText(summary).then(() => toast('Copied', 'ok'));
    });
    document.getElementById('download').addEventListener('click', () => {
      downloadBlob(new Blob([summary], { type: 'text/plain' }), 'summary.txt');
    });
  </script>
</body>
</html>
