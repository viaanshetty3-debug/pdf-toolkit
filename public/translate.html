<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Translate PDF · PDF Toolkit</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topnav"></header>
  <main>
    <h1>Translate PDF</h1>
    <p class="subtitle">Translate the extracted text into any language. Delivered as a plain-text PDF or a .txt file.</p>

    <div id="banner" class="card hidden" style="border-left: 3px solid var(--danger); margin-bottom: 16px;">
      <strong>No API key configured.</strong> Set <code>GEMINI_API_KEY</code> and restart.
    </div>

    <div class="dropzone" id="drop">
      <input type="file" />
      <div class="big">🌐</div>
      <div><strong>Drop a PDF</strong> or click to browse</div>
    </div>

    <div id="loaded" class="hidden">
      <div class="card" style="margin-top: 20px;">
        <div class="row">
          <strong id="loadedname"></strong>
          <span class="pill" id="loadedsize"></span>
          <div class="spacer"></div>
          <button class="btn secondary" id="changefile">Change file</button>
        </div>

        <label class="field">Target language</label>
        <input type="text" id="lang" value="Spanish" placeholder="e.g. Spanish, Japanese, Arabic, French" />

        <label class="field">Output format</label>
        <select id="output">
          <option value="pdf" selected>PDF (text only)</option>
          <option value="text">Plain .txt file (preserves Unicode)</option>
        </select>

        <div class="progress hidden" id="progwrap"><div class="bar" id="bar"></div></div>
        <div id="status" class="subtitle hidden" style="margin-top: 10px;"></div>

        <div class="row right" style="margin-top: 20px;">
          <button class="btn" id="go">Translate & Download</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderNav, makeDropzone, postForm, downloadBlob, humanSize, toast } from '/common.js';
    renderNav();

    (async () => {
      try {
        const r = await fetch('/api/ai/status');
        const s = await r.json();
        if (!s.configured) document.getElementById('banner').classList.remove('hidden');
      } catch {}
    })();

    let file = null;
    const dropEl = document.getElementById('drop'), loadedEl = document.getElementById('loaded');
    const bar = document.getElementById('bar'), progwrap = document.getElementById('progwrap');
    const statusEl = document.getElementById('status');

    const dz = makeDropzone(dropEl, { multiple: false });
    dz.setOnFiles(arr => {
      if (!arr.length) return;
      file = arr[0];
      document.getElementById('loadedname').textContent = file.name;
      document.getElementById('loadedsize').textContent = humanSize(file.size);
      dropEl.classList.add('hidden'); loadedEl.classList.remove('hidden');
    });
    document.getElementById('changefile').addEventListener('click', () => {
      file = null;
      dropEl.classList.remove('hidden'); loadedEl.classList.add('hidden');
    });

    document.getElementById('go').addEventListener('click', async () => {
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      fd.append('targetLanguage', document.getElementById('lang').value);
      fd.append('output', document.getElementById('output').value);
      progwrap.classList.remove('hidden'); bar.style.width = '15%';
      statusEl.classList.remove('hidden');
      statusEl.textContent = 'Translating… this can take a while for long documents.';
      try {
        const { blob } = await postForm('/api/ai/translate', fd, bar);
        const isPdf = document.getElementById('output').value === 'pdf';
        downloadBlob(blob, isPdf ? 'translated.pdf' : 'translated.txt');
        toast('Translated', 'ok');
      } catch (e) { toast(e.message, 'err'); }
      finally { setTimeout(() => { progwrap.classList.add('hidden'); statusEl.classList.add('hidden'); }, 800); }
    });
  </script>
</body>
</html>
