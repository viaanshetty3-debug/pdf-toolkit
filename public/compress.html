<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compress PDF · PDF Toolkit</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topnav"></header>
  <main>
    <h1>Compress PDF</h1>
    <p class="subtitle">Shrink your file. Image-heavy PDFs see the biggest savings.</p>

    <div class="dropzone" id="drop">
      <input type="file" />
      <div class="big">⇲</div>
      <div><strong>Drop a PDF</strong> or click to browse</div>
    </div>

    <div id="loaded" class="hidden">
      <div class="card" style="margin-top: 20px;">
        <div class="row">
          <strong id="loadedname"></strong>
          <span class="pill" id="loadedsize"></span>
          <div class="spacer"></div>
          <button class="btn secondary" id="changefile">Change file</button>
        </div>

        <label class="field">Compression level</label>
        <select id="level">
          <option value="low">Low — lossless; strips unused objects</option>
          <option value="medium" selected>Medium — recompress images at 65% quality</option>
          <option value="high">High — aggressive; smaller images at 40% quality</option>
        </select>

        <div class="progress hidden" id="progwrap"><div class="bar" id="bar"></div></div>

        <div class="row right" style="margin-top: 20px;">
          <button class="btn" id="go">Compress & Download</button>
        </div>

        <div id="stats" class="hidden" style="margin-top: 20px;">
          <h2 style="margin-top: 0;">Result</h2>
          <div class="stat-row"><span class="k">Original</span><span id="orig"></span></div>
          <div class="stat-row"><span class="k">Compressed</span><span id="comp"></span></div>
          <div class="stat-row"><span class="k">Saved</span><span id="saved"></span></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderNav, makeDropzone, postForm, downloadBlob, humanSize, toast } from '/common.js';
    renderNav();

    let file = null;
    const dropEl = document.getElementById('drop');
    const loadedEl = document.getElementById('loaded');
    const bar = document.getElementById('bar');
    const progwrap = document.getElementById('progwrap');
    const statsEl = document.getElementById('stats');

    const dz = makeDropzone(dropEl, { multiple: false });
    dz.setOnFiles(arr => {
      if (!arr.length) return;
      file = arr[0];
      document.getElementById('loadedname').textContent = file.name;
      document.getElementById('loadedsize').textContent = humanSize(file.size);
      dropEl.classList.add('hidden');
      loadedEl.classList.remove('hidden');
      statsEl.classList.add('hidden');
    });

    document.getElementById('changefile').addEventListener('click', () => {
      file = null;
      dropEl.classList.remove('hidden');
      loadedEl.classList.add('hidden');
    });

    document.getElementById('go').addEventListener('click', async () => {
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      fd.append('level', document.getElementById('level').value);
      progwrap.classList.remove('hidden'); bar.style.width = '0%';
      statsEl.classList.add('hidden');
      try {
        const { blob, headers } = await postForm('/api/compress', fd, bar);
        const orig = parseInt(headers.getResponseHeader('x-original-size'), 10);
        const comp = parseInt(headers.getResponseHeader('x-compressed-size'), 10);
        document.getElementById('orig').textContent = humanSize(orig);
        document.getElementById('comp').textContent = humanSize(comp);
        const ratio = orig > 0 ? ((1 - comp / orig) * 100).toFixed(1) : '0';
        document.getElementById('saved').textContent = `${humanSize(Math.max(orig - comp, 0))} (${ratio}%)`;
        statsEl.classList.remove('hidden');
        downloadBlob(blob, 'compressed.pdf');
        toast('Compressed', 'ok');
      } catch (e) { toast(e.message, 'err'); }
      finally { setTimeout(() => progwrap.classList.add('hidden'), 800); }
    });
  </script>
</body>
</html>
