<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Merge PDF · PDF Toolkit</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topnav"></header>
  <main>
    <h1>Merge PDF</h1>
    <p class="subtitle">Combine any number of PDFs into one. Drag to reorder.</p>

    <div class="dropzone" id="drop">
      <input type="file" />
      <div class="big">⇶</div>
      <div><strong>Drop PDFs here</strong> or click to browse</div>
      <div class="hint">Up to 50 files, 200 MB each</div>
    </div>

    <div class="file-list" id="list"></div>

    <div class="progress hidden" id="progwrap"><div class="bar" id="bar"></div></div>

    <div class="row right" style="margin-top: 20px;">
      <button class="btn secondary" id="clear">Clear</button>
      <button class="btn" id="go" disabled>Merge & Download</button>
    </div>
  </main>

  <script type="module">
    import { renderNav, makeDropzone, makeReorderable, postForm, downloadBlob, humanSize, toast } from '/common.js';
    renderNav();

    const dropEl = document.getElementById('drop');
    const listEl = document.getElementById('list');
    const goBtn = document.getElementById('go');
    const clearBtn = document.getElementById('clear');
    const bar = document.getElementById('bar');
    const progwrap = document.getElementById('progwrap');

    let files = [];

    function render() {
      listEl.innerHTML = files.map((f, i) => `
        <div class="file-item" draggable="true" data-idx="${i}">
          <span class="handle">⋮⋮</span>
          <span class="name">${escapeHtml(f.name)}</span>
          <span class="size">${humanSize(f.size)}</span>
          <button class="remove" data-remove="${i}" title="Remove">✕</button>
        </div>
      `).join('');
      goBtn.disabled = files.length < 2;
    }
    function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    const dz = makeDropzone(dropEl, { multiple: true });
    dz.setOnFiles(newFiles => {
      files = [...files, ...newFiles];
      render();
    });

    makeReorderable(listEl, newOrder => {
      files = newOrder.map(i => files[i]);
      render();
    });

    listEl.addEventListener('click', e => {
      const btn = e.target.closest('[data-remove]');
      if (btn) {
        files.splice(parseInt(btn.dataset.remove, 10), 1);
        render();
      }
    });

    clearBtn.addEventListener('click', () => { files = []; render(); });

    goBtn.addEventListener('click', async () => {
      if (files.length < 2) return;
      goBtn.disabled = true;
      progwrap.classList.remove('hidden');
      bar.style.width = '0%';
      try {
        const fd = new FormData();
        for (const f of files) fd.append('files', f, f.name);
        const { blob } = await postForm('/api/merge', fd, bar);
        downloadBlob(blob, 'merged.pdf');
        toast('Merged successfully', 'ok');
      } catch (e) {
        toast(e.message, 'err');
      } finally {
        goBtn.disabled = false;
        setTimeout(() => progwrap.classList.add('hidden'), 800);
      }
    });
  </script>
</body>
</html>
