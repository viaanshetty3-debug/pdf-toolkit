<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JPG to PDF · PDF Toolkit</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topnav"></header>
  <main>
    <h1>JPG to PDF</h1>
    <p class="subtitle">Combine images into a PDF. Drag to reorder.</p>

    <div class="dropzone" id="drop">
      <input type="file" />
      <div class="big">🖼</div>
      <div><strong>Drop images</strong> or click to browse</div>
      <div class="hint">JPG and PNG, up to 200 files</div>
    </div>

    <div class="file-list" id="list"></div>

    <div id="options" class="hidden" style="margin-top: 16px;">
      <label class="field">Page size</label>
      <select id="pageSize">
        <option value="image">Match image size</option>
        <option value="letter">US Letter (fit image)</option>
        <option value="a4">A4 (fit image)</option>
      </select>
    </div>

    <div class="progress hidden" id="progwrap"><div class="bar" id="bar"></div></div>

    <div class="row right" style="margin-top: 20px;">
      <button class="btn secondary" id="clear">Clear</button>
      <button class="btn" id="go" disabled>Convert & Download</button>
    </div>
  </main>

  <script type="module">
    import { renderNav, makeDropzone, makeReorderable, postForm, downloadBlob, humanSize, toast } from '/common.js';
    renderNav();
    const dropEl = document.getElementById('drop');
    const listEl = document.getElementById('list');
    const optionsEl = document.getElementById('options');
    const goBtn = document.getElementById('go');
    const bar = document.getElementById('bar');
    const progwrap = document.getElementById('progwrap');
    let files = [];

    function render() {
      listEl.innerHTML = files.map((f, i) => `
        <div class="file-item" draggable="true" data-idx="${i}">
          <span class="handle">⋮⋮</span>
          <span class="name">${esc(f.name)}</span>
          <span class="size">${humanSize(f.size)}</span>
          <button class="remove" data-remove="${i}">✕</button>
        </div>
      `).join('');
      goBtn.disabled = files.length === 0;
      optionsEl.classList.toggle('hidden', files.length === 0);
    }
    function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    const dz = makeDropzone(dropEl, { multiple: true, accept: 'image/jpeg,image/png' });
    dz.setOnFiles(nf => { files = [...files, ...nf.filter(f => f.type.startsWith('image/'))]; render(); });
    makeReorderable(listEl, newOrder => { files = newOrder.map(i => files[i]); render(); });
    listEl.addEventListener('click', e => {
      const b = e.target.closest('[data-remove]');
      if (b) { files.splice(parseInt(b.dataset.remove, 10), 1); render(); }
    });
    document.getElementById('clear').addEventListener('click', () => { files = []; render(); });
    goBtn.addEventListener('click', async () => {
      if (!files.length) return;
      const fd = new FormData();
      files.forEach(f => fd.append('files', f, f.name));
      fd.append('pageSize', document.getElementById('pageSize').value);
      progwrap.classList.remove('hidden'); bar.style.width = '0%';
      try {
        const { blob } = await postForm('/api/jpg-to-pdf', fd, bar);
        downloadBlob(blob, 'images.pdf');
        toast('Converted', 'ok');
      } catch (e) { toast(e.message, 'err'); }
      finally { setTimeout(() => progwrap.classList.add('hidden'), 800); }
    });
  </script>
</body>
</html>
